id: shell-history-secrets
title: "Secretos en historiales de shell legibles"
category: credentials
vector: credential-access
severity: medium
tier: A
reaches_root: false
validator: readable_secrets

match:
  all:
    - path: credentials.history_secret_hits
      not_empty: true

params:
  kind: history

step: "{target} contiene líneas con aspecto de credencial (password=, token, mysql -p...) legibles por {user}."

exploitation_steps: |
  Confirmado: N líneas con patrones de credencial. El motor no muestra el
  contenido. Revisar el archivo manualmente para extraer contraseñas/tokens que
  quedaron en línea de comandos y probarlos.

remediation: |
  Educar a los operadores para no pasar secretos por argumentos. Limpiar
  historiales expuestos, poner `HISTCONTROL=ignorespace`, `chmod 600` en los
  archivos de history, y rotar lo que haya quedado registrado.

references:
  - https://book.hacktricks.wiki/en/linux-hardening/privilege-escalation/index.html#read-sensitive-data
