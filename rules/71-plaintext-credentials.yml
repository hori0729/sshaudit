id: plaintext-credentials
title: "Credenciales en texto plano en archivos de configuración legibles"
category: credentials
vector: credential-access
severity: medium
tier: A
reaches_root: false
validator: readable_secrets

match:
  all:
    - path: credentials.config_secret_files
      not_empty: true

params:
  kind: configs

step: "{target} es legible por {user} y contiene credenciales -> reutilizarlas contra DB/servicios/otros usuarios."

exploitation_steps: |
  Confirmado que el archivo es legible y contiene una clave tipo password/secret.
  El motor NO volcó el valor. Un atacante leería el secreto y lo probaría contra
  la base de datos, el panel de administración, o `su` a la cuenta de servicio.

remediation: |
  Restringir permisos (0640 root:app o similar). Mover secretos a un gestor
  (Vault, secrets de systemd, variables de entorno del servicio) y rotarlos.

references:
  - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
