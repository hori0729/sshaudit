# Known Linux kernel local privilege-escalation CVEs.
#
# Maintained by hand from public advisories. Used ONLY for a version-match
# "theoretical" finding (Tier C): sshaudit never downloads or runs a kernel
# exploit. A match means "this kernel is in the vulnerable range" -- confirm
# manually and out of band.
#
# Schema (per entry):
#   id                    CVE id
#   name                  common name
#   introduced_in         first vulnerable mainline version (inclusive), or null
#   fixed_in_mainline     first fixed mainline version (exclusive upper bound)
#   fixed_in_stable       backport fixes on stable branches: a match on the same
#                         major.minor at or above this version is NOT vulnerable
#   distro_notes          distro-specific caveats (backports change real status)
#   arch                  affected architectures ("any" or a list)
#   severity              critical | high | medium
#   exploit_reliability   high | medium | low  (how reliable public PoCs are)
#   references            advisory / writeup URLs
#
# Version comparison is done in Python (sshaudit/correlation): it parses the
# running kernel's "major.minor.patch" and ignores the distro suffix.

schema: 1

cves:
